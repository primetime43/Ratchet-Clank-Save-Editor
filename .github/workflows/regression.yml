name: Regression checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Windows app and fixture regressions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build 'Ratchet And Clank Save Editor.sln' -c Release
      - name: Install native save-tool runtime
        run: ./Tools/Install-NativeDependencies.ps1
      - name: Run app regressions with disposable fixtures
        run: dotnet run --project Tests/SaveEditor.RegressionTests.csproj -c Release --no-build

  portable-research:
    name: Portable research and importer checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check bundled research and synthetic inputs
        # Native ELF/assets/private-save checks require the local research corpus.
        run: |
          python -B Tests/TestResearchOrganization.py
          python -B Tests/TestPsarc.py
          python -B Tests/TestLua50.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodHudIcons.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodElfMap.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodBonusSelection.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodWeaponLevels.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodGadgetAmmo.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodUpgradeCandidates.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodGroovitronState.py
          python -B Tests/PS3/ToolsOfDestruction/BCUS98127/v02.00/TestTodSpecialModifiers.py
